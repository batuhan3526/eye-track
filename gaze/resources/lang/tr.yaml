# Göz Faresi - Türkçe metinler (varsayılan dil).
#
# Programın ekranda gösterdiği ve sesli söylediği her metin burada, anahtarıyla.
# Bu dosya programın her zaman gösterdiği Türkçenin AYNISIDIR: bir harfi
# değişirse ekrandaki metin de değişir. Yeni bir dil = bu dosyanın bir kopyası
# (ör. de.yaml), metinler o dile çevrilmiş; kod değişmez.
#
# Kurallar:
#   - {ad} biçimindeki yer tutucular her dilde aynı kalmalı (testler denetler).
#   - "_" ile başlayan üst anahtarlar metin değil, dilin bilgisidir.
#   - "ascii" diye işaretli bölümler OpenCV ile çizilir: yalnız ASCII harf.
_name: "Türkçe"
_decimal: ","
# Bu dile uyan ayarlar (ses, dikte dili, AAC cümle paketi). config.yaml'da
# değer "auto" ya da boşsa bunlar kullanılır. Türkçe (language satırı yok)
# için config.yaml'daki değer her zaman olduğu gibi kullanılır. Başka bir
# dilde, Türkçe fabrika değeri (tr_TR-dfki-medium / tr / turkce-aac-paketi)
# yazılı kalmışsa da o dilin değeri geçer; başka bir değer elle seçilmiş
# sayılır ve her zaman kazanır. Kural: eye_gaze/i18n.py, setting().
_defaults:
  tts_voice: "tr_TR-dfki-medium"
  stt_language: "tr"
  aac_root: "turkce-aac-paketi"

