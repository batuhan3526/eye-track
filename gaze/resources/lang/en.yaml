# Göz Faresi - English texts.
#
# Every text the program shows on screen or speaks, by key; the keys and the
# {placeholders} are the same as in tr.yaml (the tests check). Sections marked
# "ascii" are drawn with OpenCV: plain ASCII letters only.
_name: "English"
_decimal: "."
# The settings that suit this language (voice, dictation language, AAC
# phrase pack). Used when config.yaml says "auto" or nothing - and also when
# it still holds the Turkish factory value (tr_TR-dfki-medium / tr /
# turkce-aac-paketi), which the template carries. Any other value was chosen
# on purpose and always wins. The rule: eye_gaze/i18n.py, setting().
_defaults:
  tts_voice: "en_US-ljspeech-medium"
  stt_language: "en"
  aac_root: "english-aac-pack"

